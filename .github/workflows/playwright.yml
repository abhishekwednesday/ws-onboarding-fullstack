name: Playwright Tests
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request: null
  workflow_dispatch: null
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-noble
      options: --user root
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - run: echo "node_version=$(cat .github/nodejs.version)" >> $GITHUB_ENV
      - name: "use node ${{ env.node_version }}"
        uses: actions/setup-node@v3
        with:
          node-version: "${{ env.node_version }}"

      - name: "Install pnpm & dependencies"
        uses: pnpm/action-setup@v4
        with:
          run_install: |
            - recursive: true
            - args: [--frozen-lockfile]

      - name: Load .env.test robustly
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const dotenv = require('dotenv');
            const envConfig = dotenv.parse(fs.readFileSync('.env.test'));
            const SKIP = new Set(['DATABASE_URL']);
            for (const k in envConfig) {
              if (SKIP.has(k)) continue;
              const delimiter = \`GH_ENV_\${k}_\${crypto.randomBytes(4).toString('hex')}\`;
              fs.appendFileSync(process.env.GITHUB_ENV, \`\${k}<<\${delimiter}\n\${envConfig[k]}\n\${delimiter}\n\`);
            }
          "

      - name: Set CI database URL
        run: echo "DATABASE_URL=postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable" >> $GITHUB_ENV

      - name: Apply database schema
        run: |
          node -e "
            const { Pool } = require('pg');
            const fs = require('fs');
            const pool = new Pool({ connectionString: process.env.DATABASE_URL, ssl: false });
            async function run() {
              const authSql = fs.readFileSync('docs/db/auth-schema.sql', 'utf8');
              for (const stmt of authSql.split(';').map(s => s.trim()).filter(Boolean)) {
                try { await pool.query(stmt); }
                catch (e) { console.warn('Skipped (will be created by Better Auth):', e.message); }
              }
              const playlistSql = fs.readFileSync('docs/db/playlist-schema.sql', 'utf8');
              await pool.query(playlistSql);
              await pool.end();
              console.log('Database schema applied');
            }
            run().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Run Playwright tests
        run: pnpm playwright test
        env:
          HOME: /root
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30