name: Playwright Tests
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request: null
  workflow_dispatch: null
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-noble
      options: --user root
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - run: echo "node_version=$(cat .github/nodejs.version)" >> $GITHUB_ENV
      - name: "use node ${{ env.node_version }}"
        uses: actions/setup-node@v3
        with:
          node-version: "${{ env.node_version }}"

      - name: "Install pnpm & dependencies"
        uses: pnpm/action-setup@v4
        with:
          run_install: |
            - recursive: true
            - args: [--frozen-lockfile]

      - name: Load .env.test robustly
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const dotenv = require('dotenv');
            const envConfig = dotenv.parse(fs.readFileSync('.env.test'));
            for (const k in envConfig) {
              const delimiter = \`GH_ENV_\${k}_\${crypto.randomBytes(4).toString('hex')}\`;
              fs.appendFileSync(process.env.GITHUB_ENV, \`\${k}<<\${delimiter}\n\${envConfig[k]}\n\${delimiter}\n\`);
            }
          "

      - name: Run Playwright tests
        run: pnpm playwright test
        env:
          HOME: /root
          CI: true
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
